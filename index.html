<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mundo Games — Auto Refresh</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="site" src="https://mundogames.co.mz/" title="Mundo Games"></iframe>
  <script>
    // Recarrega o website incorporado a cada 2 horas.
    const refreshInterval = 2 * 60 * 60 * 1000;
    setInterval(() => {
      document.getElementById("site").src = "https://mundogames.co.mz/";
    }, refreshInterval);
  </script>
</body>
</html>
